<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Шоколадний будиночок">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c3a28"/>
      <stop offset="1" stop-color="#3d261c"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4b32"/>
      <stop offset="1" stop-color="#5c3a26"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="640" fill="url(#sky)"/>

  <text x="500" y="120" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#f5e8dc" font-weight="bold">Шоколадний будиночок</text>
  <text x="500" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#d6bda5">вул. Шовковична, 17/2 · Київ</text>

  <!-- Roofline -->
  <rect x="90" y="300" width="820" height="14" fill="#241610"/>
  <rect x="90" y="288" width="820" height="12" fill="#2e1c14"/>

  <!-- Facade -->
  <rect x="90" y="314" width="820" height="230" fill="url(#facade)"/>

  <!-- Ground line -->
  <rect x="0" y="544" width="1000" height="10" fill="#2a1a12"/>

  <!-- Arched window arcade, echoing the mansion's own facade rhythm -->
  <g fill="#2a1811">
    <g transform="translate(150,340)">
      <rect x="0" y="70" width="86" height="120" />
      <path d="M0,70 A43,50 0 0 1 86,70 Z"/>
    </g>
    <g transform="translate(270,340)">
      <rect x="0" y="70" width="86" height="120" />
      <path d="M0,70 A43,50 0 0 1 86,70 Z"/>
    </g>
    <g transform="translate(390,340)">
      <rect x="0" y="70" width="86" height="120" />
      <path d="M0,70 A43,50 0 0 1 86,70 Z"/>
    </g>
    <g transform="translate(524,340)">
      <rect x="0" y="70" width="86" height="120" />
      <path d="M0,70 A43,50 0 0 1 86,70 Z"/>
    </g>
    <g transform="translate(644,340)">
      <rect x="0" y="70" width="86" height="120" />
      <path d="M0,70 A43,50 0 0 1 86,70 Z"/>
    </g>
    <g transform="translate(764,340)">
      <rect x="0" y="70" width="86" height="120" />
      <path d="M0,70 A43,50 0 0 1 86,70 Z"/>
    </g>
  </g>

  <!-- Decorative cornice dots, a light nod to the building's stucco garlands -->
  <g fill="#9c6a45">
    <circle cx="193" cy="322" r="4"/>
    <circle cx="313" cy="322" r="4"/>
    <circle cx="433" cy="322" r="4"/>
    <circle cx="567" cy="322" r="4"/>
    <circle cx="687" cy="322" r="4"/>
    <circle cx="807" cy="322" r="4"/>
  </g>

  <text x="500" y="600" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#b99674" font-style="italic">Особняк Могильовцева, 1899–1901 · арх. Володимир Ніколаєв</text>
</svg>
