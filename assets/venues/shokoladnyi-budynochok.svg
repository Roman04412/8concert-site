<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Шоколадний будиночок">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4630"/>
      <stop offset="1" stop-color="#4a2f22"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a3c"/>
      <stop offset="1" stop-color="#6a4530"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#332018"/>
      <stop offset="1" stop-color="#241712"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="640" fill="url(#sky)"/>

  <!-- Cornice / roofline -->
  <rect x="40" y="86" width="920" height="16" fill="#241610"/>
  <rect x="40" y="72" width="920" height="14" fill="#2e1c14"/>

  <!-- Facade -->
  <rect x="40" y="102" width="920" height="430" fill="url(#facade)"/>

  <!-- Upper floor: arched windows -->
  <g fill="#2a1811">
    <g transform="translate(78,140)">
      <rect x="0" y="60" width="92" height="130"/>
      <path d="M0,60 A46,54 0 0 1 92,60 Z"/>
    </g>
    <g transform="translate(206,140)">
      <rect x="0" y="60" width="92" height="130"/>
      <path d="M0,60 A46,54 0 0 1 92,60 Z"/>
    </g>
    <g transform="translate(334,140)">
      <rect x="0" y="60" width="92" height="130"/>
      <path d="M0,60 A46,54 0 0 1 92,60 Z"/>
    </g>
    <g transform="translate(490,140)">
      <rect x="0" y="60" width="92" height="130"/>
      <path d="M0,60 A46,54 0 0 1 92,60 Z"/>
    </g>
    <g transform="translate(618,140)">
      <rect x="0" y="60" width="92" height="130"/>
      <path d="M0,60 A46,54 0 0 1 92,60 Z"/>
    </g>
    <g transform="translate(746,140)">
      <rect x="0" y="60" width="92" height="130"/>
      <path d="M0,60 A46,54 0 0 1 92,60 Z"/>
    </g>
    <g transform="translate(830,140)">
      <rect x="0" y="60" width="92" height="130"/>
      <path d="M0,60 A46,54 0 0 1 92,60 Z"/>
    </g>
  </g>

  <!-- Decorative garland dots below the arches -->
  <g fill="#b98a63">
    <circle cx="124" cy="122" r="4"/>
    <circle cx="252" cy="122" r="4"/>
    <circle cx="380" cy="122" r="4"/>
    <circle cx="536" cy="122" r="4"/>
    <circle cx="664" cy="122" r="4"/>
    <circle cx="792" cy="122" r="4"/>
    <circle cx="876" cy="122" r="4"/>
  </g>

  <!-- String course dividing the floors -->
  <rect x="40" y="330" width="920" height="10" fill="#2e1c14"/>

  <!-- Ground floor: rectangular windows -->
  <g fill="#241610">
    <rect x="90" y="368" width="80" height="120"/>
    <rect x="218" y="368" width="80" height="120"/>
    <rect x="346" y="368" width="80" height="120"/>
    <rect x="474" y="368" width="80" height="120"/>
    <rect x="602" y="368" width="80" height="120"/>
    <rect x="730" y="368" width="80" height="120"/>
    <rect x="850" y="368" width="80" height="150"/>
  </g>

  <!-- Ground line -->
  <rect x="0" y="532" width="1000" height="108" fill="url(#ground)"/>
</svg>