[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# One-off redirect: this record's old Airtable row was deleted/replaced
# (rescheduled to 27 вересня) on 2026-08-28, BEFORE the archive-persistence
# fix in scripts/persist-archive.mjs existed, so its page was lost to a
# 404 instead of surviving like every future rename/deletion now will.
# Pointing the old URL at the event's new page preserves any links/SEO
# value it had instead of leaving a dead end.
[[redirects]]
  from = "/concert/the-best-of-love-kyivska-troianda-tyslpa/"
  to = "/concert/the-best-of-love-kyivska-troianda-27-veresnia-ssyyf7/"
  status = 301

# One-off redirects: these records had no Title filled in yet in Airtable at
# some point, so build.js's fallback ("Назва уточнюється") produced a
# placeholder slug for them (see buildConcertData in
# data/build-parts/part-16.txt). Google indexed those placeholder URLs before
# the title was filled in (or the record was removed) and, since slugs are
# recomputed from the CURRENT title on every build with no memory of the old
# one, the placeholder URL just 404s afterwards with no redirect. Added
# 2026-09-15 after Rocky spotted these in Google Search Console.
[[redirects]]
  from = "/concert/nazva-utochniuietsia-f5zvln/"
  to = "/concert/skasovano-billie-eilish-lana-del-rey-f5zvln/"
  status = 301

# Record no longer exists on the site at all (removed from Airtable before
# ever getting a title) — no live page to point to, so send visitors home
# instead of leaving them on a dead end.
[[redirects]]
  from = "/concert/nazva-utochniuietsia-aicsv8/"
  to = "/"
  status = 301

[[redirects]]
  from = "/concert/nazva-utochniuietsia-xxpiy7/"
  to = "/"
  status = 301

[[redirects]]
  from = "/concert/nazva-utochniuietsia-2d4pqw/"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://a.plerdy.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://*.plerdy.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'"
